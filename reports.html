<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>KR 주택시장 월보 — 발간 목록</title>
<style>
:root{--ink:#1f2430;--sub:#5f6572;--mut:#9aa0ac;--line:#e3e6ec;--bg:#f6f7f9;--card:#ffffff;
--up:#0f6e56;--upbg:#e1f5ee;--acc:#185fa5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Malgun Gothic","맑은 고딕",Pretendard,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:32px 22px 70px}
a{color:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:22px;margin:0}
.back{font-size:13px;text-decoration:none}
.sub{color:var(--sub);font-size:13px;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;margin-top:20px}
ul.iss{margin:0;padding:0;list-style:none}
ul.iss li{border-bottom:1px solid var(--line)}
ul.iss li:last-child{border-bottom:0}
ul.iss a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;
 text-decoration:none;font-size:15.5px;font-weight:600;color:var(--ink);border-radius:8px}
ul.iss a:hover{background:var(--bg)}
ul.iss .pdf{color:var(--mut);font-size:12px;font-weight:400}
.new{background:var(--upbg);color:var(--up);font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;margin-left:8px}
.hint{color:var(--mut);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>KR 주택시장 월보</h1><a class="back" href="./index.html">← 대시보드</a></div>
<div class="sub">한국투자금융지주 글로벌리서치실 — 매월 17일 발간 · 클릭하면 브라우저에서 PDF가 열립니다</div>
<div class="card"><ul class="iss"><li><a href="./report-2026-08.pdf"><span>KR 주택시장 월보 2026년 8월호<span class="new">최신</span></span><span class="pdf">PDF ↗</span></a></li><li><a href="./report-2026-07.pdf"><span>KR 주택시장 월보 2026년 7월호</span><span class="pdf">PDF ↗</span></a></li><li><a href="./report-2026-06.pdf"><span>KR 주택시장 월보 2026년 6월호</span><span class="pdf">PDF ↗</span></a></li></ul></div>
<div class="hint">본 자료는 내부 참고용이며 투자 추천이 아닙니다. 무단 전재·재배포 금지.</div>
</div>

</html>
